name: Release APK

on:
  push:
    tags:
      - 'v*'
  # The same release from the Actions tab, for when the tag cannot be pushed. The tag is made
  # only as the release is published, so a run that fails leaves neither behind.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, such as v0.4.20 (tagged on the commit of this run)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set APK version from tag
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$REQUESTED"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like v1.2.3"; exit 1; }
            [ "$GITHUB_REF_NAME" = main ] || { echo "::error::Releases are made from main"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists"; exit 1
            fi
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "MATO_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"

      - name: Validate and build release APK
        env:
          MATO_VERSION_CODE: ${{ github.run_number }}
        run: >-
          ./gradlew :androidApp:testGttDebugUnitTest :androidApp:assembleDebug
          :androidApp:lintGttDebug :androidApp:assembleRelease --no-daemon

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/mato-release.p12" "$RUNNER_TEMP/mato-aligned.apk"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mato-release.p12"
          # The standard app, then the MATO live variant beside it.
          for flavor in gtt mato; do
            suffix=""; [ "$flavor" = mato ] && suffix="-mato"
            apk="Torino-Bus-Radar-${RELEASE_TAG}${suffix}.apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 \
              "androidApp/build/outputs/apk/$flavor/release/androidApp-$flavor-release-unsigned.apk" \
              "$RUNNER_TEMP/mato-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/mato-release.p12" \
              --ks-key-alias mato-release \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEYSTORE_PASSWORD \
              --out "$apk" \
              "$RUNNER_TEMP/mato-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag must already be there; a run from the Actions tab tags this commit now.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then where=(--target "$GITHUB_SHA"); else where=(--verify-tag); fi
          gh release create "$RELEASE_TAG" "Torino-Bus-Radar-${RELEASE_TAG}.apk" \
            "Torino-Bus-Radar-${RELEASE_TAG}-mato.apk" "${where[@]}" --generate-notes
