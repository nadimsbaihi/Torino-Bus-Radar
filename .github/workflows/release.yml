name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set APK version from tag
        run: echo "MATO_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MATO_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/mato-release.p12" "$RUNNER_TEMP/mato-aligned.apk"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mato-release.p12"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 \
            androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk \
            "$RUNNER_TEMP/mato-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/mato-release.p12" \
            --ks-key-alias mato-release \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "Torino-Bus-Radar-${GITHUB_REF_NAME}.apk" \
            "$RUNNER_TEMP/mato-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            "Torino-Bus-Radar-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Torino-Bus-Radar-${GITHUB_REF_NAME}.apk" --verify-tag --generate-notes
