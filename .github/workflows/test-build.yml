name: Test build

# A debug APK of a work-in-progress branch, to try on a phone. It is uploaded as a run artifact only:
# never a release, so the app's update check never offers it. Debug builds install beside the real
# app (their ID ends in .debug).
on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      # The APK comes first, so a failing test still leaves something to try; the run is red either way.
      - name: Build the debug APK
        run: ./gradlew :androidApp:assembleGttDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Torino-Bus-Radar-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/gtt/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        run: ./gradlew :androidApp:testGttDebugUnitTest --no-daemon
